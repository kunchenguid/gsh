name: CI

on:
  push:
    branches:
      - main
  # release-please opens its release PR with GITHUB_TOKEN, which creates a
  # pull_request run that can only sit in action_required. Its output set is
  # exactly these files, so excluding them means no run is ever created.
  pull_request:
    branches:
      - main
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - flake.nix

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.x"

      - name: Install tools
        run: make install-tools

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - name: Run CI checks
        run: make ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
